apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchbase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: couchbase
  template:
    metadata:
      labels:
        app: couchbase
    spec:
      containers:
        - name: couchbase
          image: couchbase:community
          ports:
            - containerPort: 8091
            - containerPort: 8092
            - containerPort: 8093
            - containerPort: 8094
            - containerPort: 11210
---
apiVersion: v1
kind: Service
metadata:
  name: couchbase-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: couchbase
  ports:
    - name: admin
      port: 8091
      targetPort: 8091
    - name: query
      port: 8093
      targetPort: 8093
    - name: data
      port: 11210
      targetPort: 11210
---
apiVersion: v1
kind: Service
metadata:
  name: couchbase
spec:
  type: NodePort
  selector:
    app: couchbase
  ports:
    - name: admin
      port: 8091
      targetPort: 8091
      nodePort: 31637
    - name: query
      port: 8093
      targetPort: 8093
      nodePort: 32146
    - name: data
      port: 11210
      targetPort: 11210
      nodePort: 31119
