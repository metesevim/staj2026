apiVersion: v1
kind: Service
metadata:
  name: staj2026-gateway-service
spec:
  selector:
    app: staj2026-gateway
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staj2026-gateway
spec:
  replicas: 1

  selector:
    matchLabels:
      app: staj2026-gateway

  template:
    metadata:
      labels:
        app: staj2026-gateway

    spec:
      containers:
        - name: staj2026-gateway
          image: staj2026-gateway:ci
          imagePullPolicy: Never

          ports:
            - containerPort: 8081

          env:
            - name: BACKEND_URL
              value: http://staj2026-app-service:8080