apiVersion: v1
kind: Secret
metadata:
  name: staj2026-secrets
type: Opaque
stringData:
  postgres-password: postgres
  jwt-secret: ci-pipeline-secret-key-must-be-at-least-32-characters

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: staj2026
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: staj2026-secrets
                  key: postgres-password
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - staj2026
            initialDelaySeconds: 5
            periodSeconds: 5