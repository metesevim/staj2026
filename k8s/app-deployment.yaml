apiVersion: apps/v1
kind: Deployment

metadata:
  name: staj2026-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: staj2026-app

  template:
    metadata:
      labels:
        app: staj2026-app

    spec:
      containers:
        - name: staj2026-app
          image: staj2026-app:elastic-v1
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          env:
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch:9200

            - name: SPRING_DATA_REDIS_HOST
              value: valkey

            - name: SPRING_DATA_REDIS_PORT
              value: "6379"

            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/staj2026

            - name: SPRING_DATASOURCE_USERNAME
              value: postgres

            - name: SPRING_DATASOURCE_PASSWORD
              value: postgres

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: staj2026-secret
                  key: jwt-secret