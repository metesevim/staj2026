name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test backend
        run: ./mvnw clean verify

      - name: Build and test gateway
        working-directory: gateway
        run: mvn clean verify

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t staj2026-app:ci .

      - name: Build gateway image
        run: docker build -t staj2026-gateway:ci ./gateway

  kubernetes-deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind

      - name: Build backend image
        run: docker build -t staj2026-app:ci .

      - name: Build gateway image
        run: docker build -t staj2026-gateway:ci ./gateway

      - name: Load images into kind
        run: |
          kind load docker-image staj2026-app:ci --name kind
          kind load docker-image staj2026-gateway:ci --name kind

      - name: Deploy application
        run: |
          kubectl apply -f k8s/ci/
          
          kubectl rollout status deployment/postgres --timeout=180s
          kubectl rollout status deployment/staj2026-app --timeout=180s
          kubectl rollout status deployment/staj2026-gateway --timeout=180s

      - name: Show Kubernetes resources
        if: always()
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services
          kubectl describe pods

      - name: Test Gateway route
        run: |
          kubectl run curl-test \
            --image=curlimages/curl:latest \
            --restart=Never \
            --rm \
            --attach \
            -- \
            curl --fail --retry 10 --retry-delay 5 \
            http://staj2026-gateway-service:8081/api/products